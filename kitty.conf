# Tan Desert — Kitty terminal config
# Retro amber glow with semi-transparent warm desert background

foreground #E8B065
background #2D1B14
selection_foreground #2D1B14
selection_background #E8B065

cursor #F5C580
cursor_text_color #2D1B14

active_border_color #D4834A
active_tab_background #D4834A
active_tab_foreground #2D1B14
inactive_tab_background #1A1410
inactive_tab_foreground #D4C5B0

# Semi-transparent backdrop — warm desert shadow
background_opacity 0.82
dynamic_background_opacity yes

# Retro amber font styling
bold_italic_font auto
font_family Iosevka Term
italic_font auto
font_size 12.0

# Colors
color0 #1A1410
color1 #C75B39
color2 #7A9A4C
color3 #D4A050
color4 #6A8BA0
color5 #9C6B7A
color6 #6B9A8A
color7 #D4C5B0
color8 #3A2C22
color9 #E8794D
color10 #8DB85C
color11 #F0C674
color12 #7DA8C0
color13 #B88094
color14 #88C4B4
color15 #EDE0D0

# Cursor shape
cursor_shape beam
cursor_beam_thickness 2.0

# Scrollback
scrollback_lines 10000

# Tab bar
tab_bar_style powerline
tab_bar_edge bottom
tab_powerline_style slanted
tab_separator " ┆ "

# Bell
visual_bell_duration 0.5
enable_audio_bell no

# Window
hide_window_decorations no
window_border_width 2.0
window_padding_width 8
confirm_os_window_close 0