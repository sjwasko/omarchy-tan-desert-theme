# Tan Desert — Hyprland theme overrides
# Semi-transparent windows with warm amber border glow

# Only override values that change from defaults — don't redefine entire blocks
# to avoid conflicts with looknfeel.conf which uses sub-block syntax

$activeBorderColor = rgb(D4834A)
$inactiveBorderColor = rgb(1A1410)
$shadowColor = rgba(2D1B14CC)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
    gaps_in = 4
    gaps_out = 8
}

decoration {
    active_opacity = 0.92
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0
    rounding = 6

    blur {
        enabled = true
        size = 6
        passes = 3
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = $shadowColor
    }
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = rgb(C75B39)
}

animations {
    enabled = yes
}